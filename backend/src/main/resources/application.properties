spring.application.name=ProjectSyncBackend

# Optional import of local .env configuration file if present
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:backend/.env[.properties]

# Active profile: 'local' for standalone local dev without Supabase; 'supabase' for cloud team database
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=8081

# JWT Configuration
jwt.secret=${JWT_SECRET:ProjectSyncAISecretKeyForJWTAuthentication2026Project}
jwt.expiration=86400000

# Supabase Storage defaults (safe fallbacks so bean injection succeeds in local mode)
supabase.storage.url=${SUPABASE_STORAGE_URL:https://htwzpyouqknfnxuvbsot.supabase.co}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:project-files}
supabase.storage.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:local-dev-key}

# VCS Storage Configuration
projectsync.vcs.storage-path=${PROJECTSYNC_VCS_PATH:${user.home}/.projectsync/repositories}
projectsync.vcs.storage-mode=local