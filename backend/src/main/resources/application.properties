spring.application.name=ProjectSyncBackend

spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require&connectTimeout=30&socketTimeout=60}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SUPABASE_DB_USERNAME:postgres.htwzpyouqnkfnxuvbsot}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=45000
spring.datasource.hikari.keepalive-time=15000
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=8081

# JWT Configuration
jwt.secret=${JWT_SECRET:ProjectSyncAISecretKeyForJWTAuthentication2026Project}
jwt.expiration=86400000

# Supabase Storage Configuration
supabase.storage.url=${SUPABASE_STORAGE_URL:https://htwzpyouqnkfnxuvbsot.supabase.co}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:project-files}
supabase.storage.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:local-dev-key}

# VCS Storage Configuration
projectsync.vcs.storage-path=${PROJECTSYNC_VCS_PATH:${user.home}/.projectsync/repositories}
projectsync.vcs.storage-mode=local
projectsync.vcs.dev-mode=${PROJECTSYNC_VCS_DEV_MODE:true}
# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent}
