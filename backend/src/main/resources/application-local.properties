# ==============================================================================
# Local Development Profile (Standalone without live Supabase connection)
# Uses H2 database in PostgreSQL mode to emulate PostgreSQL types and schema
# ==============================================================================
spring.datasource.url=jdbc:h2:file:./data/projectsync-local-db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Enable H2 web console for local debugging if desired
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
