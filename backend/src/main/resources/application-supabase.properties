# ==============================================================================
# Supabase Production / Team Database Profile
# Activate by setting SPRING_PROFILES_ACTIVE=supabase in .env or environment
# ==============================================================================
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

supabase.storage.url=${SUPABASE_STORAGE_URL:https://htwzpyouqknfnxuvbsot.supabase.co}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:project-files}
supabase.storage.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
